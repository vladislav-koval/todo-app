services:
  todoapp:
    build:
      context: .
      dockerfile: ./cmd/todoapp/Dockerfile
    container_name: todoapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - HTTP_ALLOWED_ORIGINS=${HTTP_ALLOWED_ORIGINS}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - CORE_TIME_ZONE=${CORE_TIME_ZONE}
    volumes:
      - ./out/logs:/app/out/logs
    restart: always
    ports:
      - "5050:5050"

  postgres:
    image: postgres:18.4-bookworm
    container_name: todoapp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: always

  postgres-migrate:
    profiles:
      - tools

    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations


  port-forwarder:
    profiles:
      - tools

    image: alpine/socat:1.8.0.3
    container_name: todoapp-pg-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26.1-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - .:/code


volumes:
  postgres-data: